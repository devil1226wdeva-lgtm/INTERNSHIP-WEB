server.port=8080
server.servlet.context-path=

# Application Name
spring.application.name=internship-tracker

# -------------------------------------------------------------------
# Database Configuration (Supabase PostgreSQL)
# Override via environment variables:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.dkrxjrszoovsurzurfbu}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:8438391226Deva}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning for Supabase (cloud latency)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# 'validate' - tables already created via Supabase SQL Editor
# -------------------------------------------------------------------
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Static Resources Configuration
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:internship management projct(122601)/
spring.web.resources.chain.cache=false

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.student.internshiptracker=DEBUG
