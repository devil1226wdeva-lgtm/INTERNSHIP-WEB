# ===================================================================
# Student Internship Tracker - Spring Boot Configuration
# ===================================================================

server.port=8080
server.servlet.context-path=

# Application Name
spring.application.name=internship-tracker

# -------------------------------------------------------------------
# Database Configuration (MySQL)
# Override via environment variables:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/internship_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# 'update' preserves existing tables and data across restarts
# -------------------------------------------------------------------
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# spring.jpa.properties.hibernate.dialect auto-detected based on active database
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Static Resources Configuration
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:internship management projct(122601)/
spring.web.resources.chain.cache=false

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.student.internshiptracker=DEBUG
