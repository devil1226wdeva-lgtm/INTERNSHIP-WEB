<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Student Internship Tracker</title>
    <link rel="stylesheet" href="css/liquid-glass.css">
</head>

<body>

    <div class="app-layout">

        <!-- =========================
             A. LEFT SIDEBAR
        ========================= -->
        <aside class="sidebar">
            <div>
                <!-- Brand Header -->
                <div class="sidebar-header">
                    <div class="brand-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                        </svg>
                    </div>
                    <div class="brand-title">
                        Student
                        <span>Internship Tracker</span>
                    </div>
                </div>

                <!-- Navigation List -->
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Dashboard
                    </a>

                    <a href="internships.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect width="20" height="14" x="2" y="7" rx="2" ry="2"/>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                        </svg>
                        Internships
                    </a>

                    <a href="add-internship.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Add Internship
                    </a>

                    <a href="profile.html" class="nav-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        Profile
                    </a>

                    <a href="settings.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        Settings
                    </a>
                </nav>
            </div>

            <!-- Footer: Logout -->
            <div class="sidebar-footer">
                <a href="login.html" class="nav-link logout-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </a>
            </div>
        </aside>

        <!-- =========================
             MAIN APPLICATION SHELL
        ========================= -->
        <main class="main-shell">

            <!-- Top Header -->
            <header class="top-header">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="globalSearch" placeholder="Search internships, companies, or roles...">
                </div>

                <div class="header-right">
                    <button class="notification-btn" aria-label="Notifications">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="notification-badge">1</span>
                    </button>

                    <div class="user-profile-menu" onclick="window.location.href='profile.html'">
                        <div class="user-avatar" id="headerAvatar">AK</div>
                        <div class="user-meta">
                            <span class="user-name" id="headerUserName">Student</span>
                            <span class="user-role">Student</span>
                        </div>
                        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                </div>
            </header>

            <!-- Scrollable Content Body -->
            <div class="dashboard-content-scroll">
                <div class="glass-form-card">

                    <!-- Profile Banner Header -->
                    <div class="profile-avatar-banner">
                        <div class="profile-avatar-large" id="profileAvatarIcon">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                                <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                            </svg>
                        </div>
                        <div class="profile-header-text">
                            <h2 style="font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px;">My Profile</h2>
                            <p style="font-size: 13.5px; color: var(--text-secondary);">Enter and update your student information.</p>
                        </div>
                    </div>

                    <!-- Profile Form -->
                    <form>
                        <div class="form-grid-2">
                            <div class="form-group-glass">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                            </div>

                            <div class="form-group-glass">
                                <label for="student-id">Student ID</label>
                                <input type="text" id="student-id" name="student-id" placeholder="Enter your student ID" required>
                            </div>
                        </div>

                        <div class="form-grid-2">
                            <div class="form-group-glass">
                                <label for="department">Department</label>
                                <input type="text" id="department" name="department" placeholder="e.g. Computer Science & Engineering" required>
                            </div>

                            <div class="form-group-glass">
                                <label for="year">Year of Study</label>
                                <select id="year" name="year" required>
                                    <option value="">Select your year</option>
                                    <option value="1st Year">1st Year</option>
                                    <option value="2nd Year">2nd Year</option>
                                    <option value="3rd Year">3rd Year</option>
                                    <option value="4th Year">4th Year</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-grid-2">
                            <div class="form-group-glass">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                            </div>

                            <div class="form-group-glass">
                                <label for="college">College / University</label>
                                <input type="text" id="college" name="college" placeholder="Enter your college or university name" required>
                            </div>
                        </div>

                        <div class="form-group-glass">
                            <label for="skills">Skills & Expertise</label>
                            <input type="text" id="skills" name="skills" placeholder="e.g. Java, Spring Boot, React, MySQL, Python, Git">
                        </div>

                        <div style="display: flex; gap: 14px; margin-top: 24px;">
                            <button type="submit" class="btn-glass-primary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                    <polyline points="17 21 17 13 7 13 7 21"/>
                                    <polyline points="7 3 7 8 15 8"/>
                                </svg>
                                Save Profile
                            </button>
                            <a href="dashboard.html" class="btn-glass-secondary">Cancel</a>
                        </div>
                    </form>

                </div>
            </div>

        </main>

    </div>

    <script src="js/app.js"></script>
</body>

</html>
