<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internships - Student Internship Tracker</title>
    <link rel="stylesheet" href="css/liquid-glass.css">
    <style>
        .filter-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .filter-inputs {
            display: flex;
            gap: 12px;
            flex: 1;
            max-width: 600px;
        }

        .action-link-btn {
            font-size: 12.5px;
            font-weight: 600;
            text-decoration: none;
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            transition: all 0.2s ease;
        }

        .edit-btn {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.35);
            margin-right: 8px;
        }

        .edit-btn:hover {
            background: rgba(59, 130, 246, 0.35);
            color: #fff;
        }

        .delete-btn {
            background: rgba(244, 63, 94, 0.2);
            color: #fda4af;
            border: 1px solid rgba(244, 63, 94, 0.35);
        }

        .delete-btn:hover {
            background: rgba(244, 63, 94, 0.35);
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="app-layout">

        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-header">
                    <div class="brand-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                        </svg>
                    </div>
                    <div class="brand-title">
                        Student
                        <span>Internship Tracker</span>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Dashboard
                    </a>

                    <a href="internships.html" class="nav-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect width="20" height="14" x="2" y="7" rx="2" ry="2"/>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                        </svg>
                        Internships
                    </a>

                    <a href="add-internship.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Add Internship
                    </a>

                    <a href="profile.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        Profile
                    </a>

                    <a href="settings.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        Settings
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <a href="login.html" class="nav-link logout-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </a>
            </div>
        </aside>

        <!-- Main Shell -->
        <main class="main-shell">
            <header class="top-header">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="globalSearch" placeholder="Search internships, companies, or roles...">
                </div>

                <div class="header-right">
                    <button class="notification-btn" aria-label="Notifications">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="notification-badge">1</span>
                    </button>

                    <div class="user-profile-menu" onclick="window.location.href='profile.html'">
                        <div class="user-avatar" id="headerAvatar">AK</div>
                        <div class="user-meta">
                            <span class="user-name" id="headerUserName">Student</span>
                            <span class="user-role">Student</span>
                        </div>
                        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                </div>
            </header>

            <div class="dashboard-content-scroll">
                <div class="glass-card" style="min-height: 720px;">
                    <div class="card-header-flex">
                        <div>
                            <h2 style="font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px;">My Internships</h2>
                            <p style="font-size: 13px; color: var(--text-secondary);">View and track all your internship applications and interview statuses.</p>
                        </div>
                        <a href="add-internship.html" class="btn-glass-primary">+ Add Internship</a>
                    </div>

                    <!-- Filter Toolbar -->
                    <div class="filter-toolbar">
                        <div class="filter-inputs">
                            <input type="text" id="searchInput" placeholder="Search by company or role..." 
                                style="flex: 1; padding: 10px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-pill); color: #fff; font-size: 13.5px; outline: none;">
                            <select id="statusFilter" class="glass-select" style="font-size: 13px; padding: 10px 16px;">
                                <option value="ALL">All Statuses</option>
                                <option value="Applied">Applied</option>
                                <option value="Interview">Interview</option>
                                <option value="Selected">Selected</option>
                                <option value="Rejected">Rejected</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="table-responsive">
                        <table class="glass-table">
                            <thead>
                                <tr>
                                    <th>Company</th>
                                    <th>Role</th>
                                    <th>Location</th>
                                    <th>Status</th>
                                    <th>Applied Date</th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="internshipsTableBody">
                                <!-- Populated dynamically by app.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
