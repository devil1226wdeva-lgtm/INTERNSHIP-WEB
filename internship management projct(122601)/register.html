<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Internship Tracker</title>
    <link rel="stylesheet" href="css/liquid-glass.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
    </style>
</head>

<body>

    <main class="auth-wrapper">
        <section class="auth-card" style="max-width: 480px;">

            <!-- Brand Icon -->
            <div class="auth-icon-circle">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <line x1="19" y1="8" x2="19" y2="14"/>
                    <line x1="22" y1="11" x2="16" y2="11"/>
                </svg>
            </div>

            <!-- Header -->
            <h2>Create Account</h2>
            <p>Register as a student to track your internships</p>

            <!-- Registration Form -->
            <form style="text-align: left;">

                <div class="form-grid-2">
                    <div class="form-group-glass">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
                    </div>

                    <div class="form-group-glass">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId" name="studentId" placeholder="e.g. 122601" required>
                    </div>
                </div>

                <div class="form-group-glass">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group-glass">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your student email" required>
                </div>

                <div class="form-group-glass">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password (min 6 characters)" required minlength="6">
                </div>

                <button type="submit" class="btn-glass-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 15px; margin-top: 14px;">
                    Register Account
                </button>

            </form>

            <div style="margin-top: 24px; font-size: 13.5px; color: var(--text-secondary);">
                <p style="margin-bottom: 8px;">
                    Already have an account? 
                    <a href="login.html" style="color: #60a5fa; font-weight: 600; text-decoration: none;">Login here</a>
                </p>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 12px;">Student Internship Tracker &copy; 2026</p>
            </div>

        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
